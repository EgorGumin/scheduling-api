services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: comments
      POSTGRES_PASSWORD: comments
      POSTGRES_DB: comments
    ports:
      - "5433:5432"
    volumes:
      - ./scripts/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comments -d comments"]
      interval: 2s
      timeout: 3s
      retries: 30
